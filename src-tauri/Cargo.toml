[package]
name = "antun"
version = "1.7.2"
description = "AnTun - lightweight cross-platform WARP client"
authors = ["AnTun"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "antun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
# 生成 WARP 设备密钥对（X25519），用于首次启动注册本机独享凭证
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
# 纯 WireGuard 握手探测（端点延迟 = 一个 RTT，不建隧道不发数据）
boringtun = { version = "0.7", default-features = false }
getrandom = "0.2"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinInet", "Win32_Foundation", "Win32_System_JobObjects"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
