[package]
name = "antun"
version = "1.8.6"
description = "AnTun - lightweight cross-platform WARP client"
authors = ["AnTun"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "antun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
# 生成 WARP 设备密钥对（X25519），用于首次启动注册本机独享凭证
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
# 纯 WireGuard 握手探测（端点延迟 = 一个 RTT，不建隧道不发数据）
boringtun = { version = "0.7", default-features = false }
getrandom = "0.2"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Networking_WinInet",
    "Win32_Foundation",
    "Win32_System_JobObjects",
    # TUN 提权判定（OpenProcessToken / GetTokenInformation）与提权重启（ShellExecuteW）
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # 连接明细里的应用图标：枚举进程拿 exe 路径，抽图标位图再自己编码 PNG
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = "s"
# thin LTO：fat LTO + codegen-units=1 在本机（15.5G 内存、pagefile 6.9G）会进入长时间换页，
# 40 分钟拿不到产物。thin LTO 内存占用低、可并行，体积约 +1MB，性能差异可忽略。
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
