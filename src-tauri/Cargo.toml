[package]
name = "antun"
version = "1.5.0"
description = "AnTun - lightweight cross-platform WARP client"
authors = ["AnTun"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "antun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinInet"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
